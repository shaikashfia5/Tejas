<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />

  <!-- Outer Shield Border -->
  <path d="M256 60 L390 120 V250 C390 340 256 440 256 440 C256 440 122 340 122 250 V120 Z" 
        fill="url(#shield)" 
        stroke="url(#gold)" 
        stroke-width="12" />

  <!-- Thunderbolt (Tejas / Energy / Light) -->
  <path d="M275 140 L195 270 H260 L235 370 L320 240 H255 Z" 
        fill="url(#gold)" 
        filter="drop-shadow(0px 8px 16px rgba(245, 158, 11, 0.4))" />
</svg>
